<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="100%" role="img" aria-label="Ariesfun — Make you unique!">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="52%" stop-color="#131a35"/>
      <stop offset="100%" stop-color="#1c1030"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="48%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#818cf8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1140" cy="30" r="240" fill="url(#glowA)"/>
  <circle cx="150" cy="310" r="200" fill="url(#glowB)"/>

  <text x="72" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-2" fill="url(#nameGrad)">Ariesfun</text>

  <rect x="76" y="176" width="96" height="6" rx="3" fill="url(#barGrad)"/>

  <text x="72" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#94a3b8">Make you unique!</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <rect x="72" y="238" width="104" height="32" rx="16" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="124" y="259" fill="#a5b4fc">C / C++</text>
    <rect x="188" y="238" width="164" height="32" rx="16" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="270" y="259" fill="#a5b4fc">Database Kernel</text>
    <rect x="364" y="238" width="76" height="32" rx="16" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="402" y="259" fill="#a5b4fc">Linux</text>
    <rect x="452" y="238" width="140" height="32" rx="16" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="522" y="259" fill="#a5b4fc">Self-hosting</text>
  </g>

  <g>
    <rect x="752" y="58" width="460" height="204" rx="16" fill="#0f172a" fill-opacity="0.72" stroke="#334155"/>
    <path d="M752 74a16 16 0 0 1 16-16h428a16 16 0 0 1 16 16v20H752z" fill="#1e293b"/>
    <circle cx="778" cy="76" r="6" fill="#fb7185"/>
    <circle cx="800" cy="76" r="6" fill="#fbbf24"/>
    <circle cx="822" cy="76" r="6" fill="#34d399"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
      <text x="780" y="124" fill="#64748b">$ whoami</text>
      <text x="780" y="148" fill="#a5b4fc" font-weight="700">&gt; ariesfun</text>
      <text x="780" y="178" fill="#64748b">$ cat /etc/motd</text>
      <text x="780" y="202" fill="#7dd3fc" font-weight="700">&gt; Make you unique!</text>
      <rect x="780" y="222" width="230" height="10" rx="5" fill="#1e293b"/>
      <rect x="780" y="222" width="126" height="10" rx="5" fill="url(#barGrad)"/>
      <text x="1022" y="232" fill="#64748b" font-size="13">55%</text>
      <text x="780" y="252" fill="#64748b" font-size="13">learning · database kernel</text>
    </g>
  </g>
</svg>
