name: Generate Snake

# 每天 UTC 18:00（北京时间 02:00）自动跑一次，也可以在 Actions 页面手动触发。
# 注意：这里刻意不加 `on: push`，否则 workflow 提交 SVG 后会再次触发自己，形成死循环。
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            .github/assets/github-snake.svg
            .github/assets/github-snake-dark.svg?palette=github-dark

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/github-snake.svg .github/assets/github-snake-dark.svg
          if git diff --staged --quiet; then
            echo "贡献图没有变化，跳过提交。"
          else
            git commit -m "chore: update contribution snake [skip ci]"
            git push
          fi
